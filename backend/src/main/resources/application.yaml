server:
  port: 8081

spring:
  datasource:
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: agent
    password: 1234

  jpa: # JPA 설정을 추가합니다.
    hibernate:
      ddl-auto: update # 개발 단계에서는 update 사용 (엔티티 변경 시 스키마 자동 업데이트), 운영 시에는 validate 또는 none 권장
    show-sql: true # 실행되는 SQL 로그 출력 여부 (개발 시 유용)
    properties:
      hibernate:
        # 사용하는 Oracle 버전에 맞는 Dialect를 설정합니다.
        # Hibernate 버전에 따라 클래스 이름이 다를 수 있습니다.
        # 예: org.hibernate.dialect.OracleDialect (오래된 Oracle),
        #     org.hibernate.dialect.Oracle9iDialect, Oracle10gDialect,
        #     org.hibernate.dialect.Oracle12cDialect (Oracle 12c 이상)
        dialect: org.hibernate.dialect.OracleDialect # 사용하는 Oracle DB 버전에 맞춰 설정
